name: Update dated contribution streak

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-profile-summary.yml"
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Download streak card and insert current date
        shell: bash
        run: |
          mkdir -p assets
          curl --fail --silent --show-error --location             "https://github-readme-streak-stats.herokuapp.com/?user=jashanshah-CS&theme=github-dark-blue&hide_border=true&border_radius=10"             --output assets/contribution-streak-dated.svg
          CURRENT_DATE="$(TZ=Europe/London date '+%b %-d, %Y')"
          CURRENT_DATE="$CURRENT_DATE" python - <<'PY'
          import os
          from pathlib import Path

          path = Path("assets/contribution-streak-dated.svg")
          svg = path.read_text(encoding="utf-8")
          if "Present" not in svg:
              raise SystemExit("The generated streak card no longer contains the expected Present label.")
          svg = svg.replace("Present", os.environ["CURRENT_DATE"], 1)
          path.write_text(svg, encoding="utf-8")
          PY

      - name: Commit refreshed card
        shell: bash
        run: |
          if git diff --quiet -- assets/contribution-streak-dated.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-streak-dated.svg
          git commit -m "chore: refresh dated contribution streak"
          git push
